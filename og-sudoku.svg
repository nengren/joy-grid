<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f4f8"/>
      <stop offset="100%" stop-color="#d1ecf1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid pattern -->
  <g opacity="0.06">
    <line x1="0" y1="0" x2="0" y2="630" stroke="#000" stroke-width="1" transform="translate(40,0)" />
    <line x1="0" y1="0" x2="0" y2="630" stroke="#000" stroke-width="1" transform="translate(80,0)" />
    <line x1="0" y1="0" x2="0" y2="630" stroke="#000" stroke-width="1" transform="translate(120,0)" />
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#000" stroke-width="1" transform="translate(0,40)" />
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#000" stroke-width="1" transform="translate(0,80)" />
  </g>
  <!-- Mini sudoku grid -->
  <g transform="translate(160, 140)">
    <rect width="350" height="350" rx="16" fill="#4ecdc4" opacity="0.15"/>
    <g transform="translate(15,15)">
      <rect x="0" y="0" width="100" height="100" rx="8" fill="white"/>
      <text x="50" y="65" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="bold" fill="#2d7a75">5</text>
      <rect x="110" y="0" width="100" height="100" rx="8" fill="white"/>
      <text x="160" y="65" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="bold" fill="#2d7a75">3</text>
      <rect x="220" y="0" width="100" height="100" rx="8" fill="white" opacity="0.5"/>
      <rect x="0" y="110" width="100" height="100" rx="8" fill="white" opacity="0.5"/>
      <rect x="110" y="110" width="100" height="100" rx="8" fill="white"/>
      <text x="160" y="175" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="bold" fill="#2d7a75">7</text>
      <rect x="220" y="110" width="100" height="100" rx="8" fill="white" opacity="0.5"/>
      <rect x="0" y="220" width="100" height="100" rx="8" fill="white"/>
      <text x="50" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="bold" fill="#2d7a75">6</text>
      <rect x="110" y="220" width="100" height="100" rx="8" fill="white" opacity="0.5"/>
      <rect x="220" y="220" width="100" height="100" rx="8" fill="white"/>
      <text x="270" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="bold" fill="#2d7a75">2</text>
    </g>
  </g>
  <!-- Text -->
  <text x="620" y="250" font-family="Arial,sans-serif" font-size="72" font-weight="bold" fill="#2d2a26">Sudoku</text>
  <text x="620" y="320" font-family="Arial,sans-serif" font-size="32" fill="#6b6560">Free online puzzle · All difficulty levels</text>
  <text x="620" y="420" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#4ecdc4">joy-grid.com</text>
  <!-- Logo dots -->
  <g transform="translate(620, 450)">
    <rect width="16" height="16" rx="4" fill="#ff6b35"/>
    <rect x="20" width="16" height="16" rx="4" fill="#4ecdc4"/>
    <rect y="20" width="16" height="16" rx="4" fill="#7c5cbf"/>
    <rect x="20" y="20" width="16" height="16" rx="4" fill="#ffd93d"/>
    <text x="50" y="30" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#2d2a26">Joy Grid</text>
  </g>
</svg>
