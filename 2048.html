<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#faf8f5;--text:#2d2a26;--text-soft:#6b6560;
  --accent:#ff6b35;--accent-dark:#e55a28;
  --board-bg:#bbada0;--cell-empty:#cdc1b4;
  --card-shadow:0 4px 20px rgba(0,0,0,0.08);
  --radius:16px;
}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;touch-action:none}
body::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background-image:linear-gradient(rgba(0,0,0,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,0.02) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}

nav{position:sticky;top:0;z-index:100;background:rgba(250,248,245,0.9);backdrop-filter:blur(12px);border-bottom:1px solid rgba(0,0,0,0.06);padding:0 24px}
.nav-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.6rem;color:var(--text);text-decoration:none;display:flex;align-items:center;gap:8px}
.logo-grid{display:grid;grid-template-columns:repeat(2,10px);gap:3px}
.logo-grid span{width:10px;height:10px;border-radius:3px}
.logo-grid span:nth-child(1){background:#ff6b35}
.logo-grid span:nth-child(2){background:#4ecdc4}
.logo-grid span:nth-child(3){background:#7c5cbf}
.logo-grid span:nth-child(4){background:#ffd93d}
.nav-links{display:flex;gap:24px;align-items:center}
.nav-links a{text-decoration:none;color:var(--text-soft);font-weight:600;font-size:0.95rem;transition:color 0.2s}
.nav-links a:hover,.nav-links a.active{color:var(--accent)}

.game-container{max-width:480px;margin:0 auto;padding:24px 16px 48px;position:relative;z-index:1}

.game-header{text-align:center;margin-bottom:20px}
.game-header h1{font-family:'Fredoka',sans-serif;font-size:1.8rem;font-weight:700;margin-bottom:4px}
.game-header p{color:var(--text-soft);font-size:0.9rem}

.score-bar{display:flex;justify-content:center;gap:12px;margin-bottom:16px}
.score-box{
  background:#fff;border-radius:12px;padding:8px 20px;
  box-shadow:0 2px 8px rgba(0,0,0,0.06);text-align:center;min-width:90px;
}
.score-box .label{font-size:0.72rem;font-weight:700;text-transform:uppercase;color:var(--text-soft);letter-spacing:0.5px}
.score-box .value{font-family:'Fredoka',sans-serif;font-size:1.4rem;font-weight:700;color:var(--text)}

/* Board */
.board-wrapper{
  background:var(--board-bg);border-radius:var(--radius);
  padding:10px;margin-bottom:20px;
  box-shadow:var(--card-shadow);
  position:relative;
}
.board{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:10px;
}
.cell{
  aspect-ratio:1;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Fredoka',sans-serif;font-weight:700;
  transition:transform 0.12s ease;
  user-select:none;-webkit-user-select:none;
}
.cell[data-val="0"]{background:var(--cell-empty)}
.cell[data-val="2"]{background:#eee4da;color:#776e65;font-size:clamp(1.4rem,6vw,2.2rem)}
.cell[data-val="4"]{background:#ede0c8;color:#776e65;font-size:clamp(1.4rem,6vw,2.2rem)}
.cell[data-val="8"]{background:#f2b179;color:#f9f6f2;font-size:clamp(1.4rem,6vw,2.2rem)}
.cell[data-val="16"]{background:#f59563;color:#f9f6f2;font-size:clamp(1.3rem,5.5vw,2rem)}
.cell[data-val="32"]{background:#f67c5f;color:#f9f6f2;font-size:clamp(1.3rem,5.5vw,2rem)}
.cell[data-val="64"]{background:#f65e3b;color:#f9f6f2;font-size:clamp(1.3rem,5.5vw,2rem)}
.cell[data-val="128"]{background:#edcf72;color:#f9f6f2;font-size:clamp(1.1rem,4.5vw,1.7rem);box-shadow:0 0 20px 4px rgba(237,207,114,0.3)}
.cell[data-val="256"]{background:#edcc61;color:#f9f6f2;font-size:clamp(1.1rem,4.5vw,1.7rem);box-shadow:0 0 20px 4px rgba(237,204,97,0.3)}
.cell[data-val="512"]{background:#edc850;color:#f9f6f2;font-size:clamp(1.1rem,4.5vw,1.7rem);box-shadow:0 0 20px 4px rgba(237,200,80,0.3)}
.cell[data-val="1024"]{background:#edc53f;color:#f9f6f2;font-size:clamp(0.95rem,3.8vw,1.4rem);box-shadow:0 0 30px 6px rgba(237,197,63,0.4)}
.cell[data-val="2048"]{background:#edc22e;color:#f9f6f2;font-size:clamp(0.95rem,3.8vw,1.4rem);box-shadow:0 0 30px 8px rgba(237,194,46,0.5)}
.cell.big-val{background:#3c3a32;color:#f9f6f2;font-size:clamp(0.85rem,3.2vw,1.2rem)}

@keyframes popIn{
  0%{transform:scale(0)}
  50%{transform:scale(1.15)}
  100%{transform:scale(1)}
}
@keyframes mergeAnim{
  0%{transform:scale(1)}
  50%{transform:scale(1.2)}
  100%{transform:scale(1)}
}
.cell.new{animation:popIn 0.2s ease}
.cell.merged{animation:mergeAnim 0.2s ease}

.actions{display:flex;gap:8px;justify-content:center}
.action-btn{
  padding:10px 24px;border:2px solid #e0e0e0;border-radius:12px;
  background:none;font-family:'Nunito',sans-serif;font-weight:600;
  font-size:0.9rem;cursor:pointer;transition:all 0.2s;color:var(--text-soft);
  display:flex;align-items:center;gap:6px;
  -webkit-tap-highlight-color:transparent;
}
.action-btn:hover{border-color:var(--accent);color:var(--accent)}

/* Game over overlay */
.overlay{
  display:none;position:absolute;top:0;left:0;right:0;bottom:0;
  background:rgba(238,228,218,0.7);border-radius:var(--radius);
  justify-content:center;align-items:center;flex-direction:column;
  z-index:10;
}
.overlay.show{display:flex}
.overlay h2{font-family:'Fredoka',sans-serif;font-size:1.8rem;margin-bottom:12px}
.overlay .try-again{
  padding:10px 28px;border:none;border-radius:10px;
  background:var(--accent);color:#fff;font-family:'Fredoka',sans-serif;
  font-size:1rem;font-weight:600;cursor:pointer;
}
.overlay .try-again:hover{background:var(--accent-dark)}

/* Share buttons */
.share-section{margin-top:16px}
.share-label{font-size:0.82rem;color:var(--text-soft);margin-bottom:8px;font-weight:600}
.share-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.share-btn{
  width:42px;height:42px;border:none;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:transform 0.15s;
  -webkit-tap-highlight-color:transparent;
  font-size:1.2rem;color:#fff;font-weight:700;
  font-family:'Nunito',sans-serif;
}
.share-btn:hover{transform:scale(1.1)}
.share-btn:active{transform:scale(0.95)}
.share-btn.twitter{background:#000}
.share-btn.whatsapp{background:#25D366}
.share-btn.native-share{background:var(--accent);font-size:1.3rem}
.share-btn.copy-link{background:#6b6560;font-size:1.2rem}

/* Mobile/Desktop share layout */
.share-desktop{display:flex;gap:8px;justify-content:center}
.share-mobile{display:none;flex-direction:column;align-items:center;gap:8px}
.share-mobile .share-main-btn{
  padding:12px 32px;border:none;border-radius:12px;
  background:var(--accent);color:#fff;font-family:'Nunito',sans-serif;
  font-size:1rem;font-weight:700;cursor:pointer;transition:transform 0.15s;
  display:flex;align-items:center;gap:8px;
  -webkit-tap-highlight-color:transparent;
}
.share-mobile .share-main-btn:active{transform:scale(0.95)}
.share-mobile .copy-row{display:flex;gap:8px}
@media(max-width:768px){.share-desktop{display:none}.share-mobile{display:flex}}
.share-toast{
  display:none;position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  background:#333;color:#fff;padding:10px 24px;border-radius:10px;
  font-size:0.9rem;font-weight:600;z-index:300;
  animation:fadeInUp 0.3s ease;
}
.share-toast.show{display:block}
@keyframes fadeInUp{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

footer{text-align:center;padding:24px;color:var(--text-soft);font-size:0.85rem;border-top:1px solid rgba(0,0,0,0.06);position:relative;z-index:1}
footer a{color:var(--accent);text-decoration:none}

@media(max-width:640px){
  .nav-links{display:none}
  .game-container{padding:16px 10px 32px}
  .board{gap:8px}
  .board-wrapper{padding:8px}
}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="/" class="logo">
      <div class="logo-grid"><span></span><span></span><span></span><span></span></div>
      Joy Grid
    </a>
    <div class="nav-links">
      <a href="/sudoku.html">Sudoku</a>
      <a href="/2048.html" class="active">2048</a>
      <a href="/minesweeper.html">Minesweeper</a>
    </div>
  </div>
</nav>

<div class="game-container">
  <div class="game-header">
    <h1>2048</h1>
    <p>Slide tiles and merge them to reach 2048!</p>
  </div>

  <div class="score-bar">
    <div class="score-box"><div class="label">Score</div><div class="value" id="score">0</div></div>
    <div class="score-box"><div class="label">Best</div><div class="value" id="best">0</div></div>
  </div>

  </div>

  <div class="actions">
    <button class="action-btn" onclick="newGame()">🔄 New Game</button>
    <button class="action-btn" onclick="undoMove()">↩ Undo</button>
  </div>
</div>

<!-- Full screen overlays -->
<div class="win-overlay" id="gameOverOverlay" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:200;justify-content:center;align-items:center">
  <div style="background:#fff;border-radius:16px;padding:40px;text-align:center;max-width:360px;margin:20px;animation:popIn 0.4s ease;position:relative">
    <button onclick="document.getElementById('gameOverOverlay').style.display='none'" style="position:absolute;top:12px;right:12px;width:32px;height:32px;border:none;border-radius:50%;background:rgba(0,0,0,0.08);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;color:#6b6560">✕</button>
    <h2 style="font-family:'Fredoka',sans-serif;font-size:2rem;margin-bottom:8px">Game Over!</h2>
    <p id="gameOverMsg" style="color:#6b6560;margin-bottom:20px;line-height:1.5"></p>
    <button class="try-again" onclick="newGame();document.getElementById('gameOverOverlay').style.display='none'" style="padding:12px 32px;border:none;border-radius:12px;background:#ff6b35;color:#fff;font-family:'Fredoka',sans-serif;font-size:1.1rem;font-weight:600;cursor:pointer">Try Again</button>
    <div class="share-section">
      <div class="share-label">Share your score</div>
      <div class="share-btns" id="shareGameOver"></div>
    </div>
  </div>
</div>

<div class="win-overlay" id="winOverlay" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:200;justify-content:center;align-items:center">
  <div style="background:#fff;border-radius:16px;padding:40px;text-align:center;max-width:360px;margin:20px;animation:popIn 0.4s ease;position:relative">
    <button onclick="document.getElementById('winOverlay').style.display='none'" style="position:absolute;top:12px;right:12px;width:32px;height:32px;border:none;border-radius:50%;background:rgba(0,0,0,0.08);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;color:#6b6560">✕</button>
    <h2 style="font-family:'Fredoka',sans-serif;font-size:2rem;margin-bottom:8px;color:#ff6b35">🎉 You reached 2048!</h2>
    <p id="winMsg2048" style="color:#6b6560;margin-bottom:20px;line-height:1.5"></p>
    <button class="try-again" onclick="keepPlaying()" style="padding:12px 32px;border:none;border-radius:12px;background:#ff6b35;color:#fff;font-family:'Fredoka',sans-serif;font-size:1.1rem;font-weight:600;cursor:pointer">Keep Playing</button>
    <div class="share-section">
      <div class="share-label">Challenge your friends</div>
      <div class="share-btns" id="shareWin"></div>
    </div>
  </div>
</div>
<div class="share-toast" id="shareToast">Copied!</div>

<footer>
  <p><a href="/">Joy Grid</a> · <a href="/about.html">About</a> · <a href="/privacy.html">Privacy Policy</a></p>
</footer>

<script>
const SIZE = 4;
let grid = [];
let score = 0;
let best = parseInt(localStorage.getItem('2048_best') || '0');
let prevGrid = null;
let prevScore = 0;
let won = false;
let keepGoing = false;
let newTiles = [];
let mergedTiles = [];

function newGame() {
  grid = Array.from({length:SIZE}, () => Array(SIZE).fill(0));
  score = 0;
  won = false;
  keepGoing = false;
  prevGrid = null;
  newTiles = [];
  mergedTiles = [];
  addRandomTile();
  addRandomTile();
  document.getElementById('gameOverOverlay').style.display='none';
  document.getElementById('winOverlay').style.display='none';
  render();
}

function addRandomTile() {
  const empty = [];
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++)
      if (grid[r][c] === 0) empty.push([r, c]);
  if (empty.length === 0) return;
  const [r, c] = empty[Math.floor(Math.random() * empty.length)];
  grid[r][c] = Math.random() < 0.9 ? 2 : 4;
  newTiles.push(`${r}-${c}`);
}

function render() {
  const el = document.getElementById('board');
  el.innerHTML = '';
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const val = grid[r][c];
      cell.dataset.val = val > 2048 ? 'big' : val;
      if (val > 2048) cell.classList.add('big-val');
      cell.textContent = val || '';
      const key = `${r}-${c}`;
      if (newTiles.includes(key)) cell.classList.add('new');
      if (mergedTiles.includes(key)) cell.classList.add('merged');
      el.appendChild(cell);
    }
  }
  document.getElementById('score').textContent = score;
  if (score > best) { best = score; localStorage.setItem('2048_best', best); }
  document.getElementById('best').textContent = best;
  newTiles = [];
  mergedTiles = [];
}

function slide(row) {
  let arr = row.filter(v => v !== 0);
  const result = [];
  let sc = 0;
  let merged = [];
  for (let i = 0; i < arr.length; i++) {
    if (i + 1 < arr.length && arr[i] === arr[i+1]) {
      result.push(arr[i] * 2);
      sc += arr[i] * 2;
      merged.push(result.length - 1);
      i++;
    } else {
      result.push(arr[i]);
    }
  }
  while (result.length < SIZE) result.push(0);
  return { result, sc, merged };
}

function move(dir) {
  prevGrid = grid.map(r => [...r]);
  prevScore = score;
  let moved = false;
  mergedTiles = [];

  if (dir === 'left' || dir === 'right') {
    for (let r = 0; r < SIZE; r++) {
      let row = [...grid[r]];
      if (dir === 'right') row.reverse();
      const { result, sc, merged } = slide(row);
      if (dir === 'right') result.reverse();
      for (const mi of merged) {
        const actualC = dir === 'right' ? SIZE - 1 - mi : mi;
        mergedTiles.push(`${r}-${actualC}`);
      }
      if (result.join() !== grid[r].join()) moved = true;
      grid[r] = result;
      score += sc;
    }
  } else {
    for (let c = 0; c < SIZE; c++) {
      let col = [];
      for (let r = 0; r < SIZE; r++) col.push(grid[r][c]);
      if (dir === 'down') col.reverse();
      const { result, sc, merged } = slide(col);
      if (dir === 'down') result.reverse();
      for (const mi of merged) {
        const actualR = dir === 'down' ? SIZE - 1 - mi : mi;
        mergedTiles.push(`${actualR}-${c}`);
      }
      let orig = [];
      for (let r = 0; r < SIZE; r++) orig.push(grid[r][c]);
      if (result.join() !== orig.join()) moved = true;
      for (let r = 0; r < SIZE; r++) grid[r][c] = result[r];
      score += sc;
    }
  }

  if (moved) {
    addRandomTile();
    render();
    if (!won && !keepGoing) checkWin();
    if (isGameOver()) {
      document.getElementById('gameOverMsg').textContent = `Score: ${score.toLocaleString()} · Best tile: ${getBestTile()}`;
      populateShareBtns('shareGameOver');
      setTimeout(() => document.getElementById('gameOverOverlay').style.display='flex', 300);
    }
  }
}

function undoMove() {
  if (!prevGrid) return;
  grid = prevGrid;
  score = prevScore;
  prevGrid = null;
  render();
}

function getBestTile() {
  let best = 0;
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++)
      if (grid[r][c] > best) best = grid[r][c];
  return best;
}

function checkWin() {
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++)
      if (grid[r][c] === 2048) {
        won = true;
        document.getElementById('winMsg2048').textContent = `Score: ${score.toLocaleString()}! You reached 2048!`;
        populateShareBtns('shareWin');
        document.getElementById('winOverlay').style.display='flex';
        return;
      }
}

function keepPlaying() {
  keepGoing = true;
  document.getElementById('winOverlay').style.display='none';
}

function isGameOver() {
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++) {
      if (grid[r][c] === 0) return false;
      if (c + 1 < SIZE && grid[r][c] === grid[r][c+1]) return false;
      if (r + 1 < SIZE && grid[r][c] === grid[r+1][c]) return false;
    }
  return true;
}

// Keyboard
document.addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
    e.preventDefault();
    const map = {ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};
    move(map[e.key]);
  }
});

// Touch/Swipe
let touchStartX, touchStartY;
document.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, {passive: true});

document.addEventListener('touchend', e => {
  if (!touchStartX) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  const absDx = Math.abs(dx), absDy = Math.abs(dy);
  if (Math.max(absDx, absDy) < 30) return;
  if (absDx > absDy) move(dx > 0 ? 'right' : 'left');
  else move(dy > 0 ? 'down' : 'up');
  touchStartX = null;
});

// ===== SHARE FUNCTIONS =====
const shareBtnHTML = `
  <div class="share-mobile">
    <button class="share-main-btn" onclick="nativeShare()">📤 Share Result</button>
    <div class="copy-row"><button class="share-btn copy-link" onclick="copyShareText()">📋 Copy</button></div>
  </div>
  <div class="share-desktop">
    <button class="share-btn twitter" onclick="shareTwitter()" title="Share on X">𝕏</button>
    <button class="share-btn whatsapp" onclick="shareWhatsApp()" title="WhatsApp">WA</button>
    <button class="share-btn copy-link" onclick="copyShareText()" title="Copy">📋</button>
  </div>`;

function populateShareBtns(containerId) {
  const el = document.getElementById(containerId);
  el.innerHTML = shareBtnHTML;
}

function getShareText() {
  const tile = getBestTile();
  return `🎯 I scored ${score.toLocaleString()} in 2048! Best tile: ${tile}. Can you do better?\n\nhttps://joy-grid.com/2048.html`;
}
function getShareUrl() { return 'https://joy-grid.com/2048.html'; }

function shareTwitter() {
  window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(getShareText())}`, '_blank');
}
function shareWhatsApp() {
  window.open(`https://wa.me/?text=${encodeURIComponent(getShareText())}`, '_blank');
}
function nativeShare() {
  if (navigator.share) {
    navigator.share({ title: 'Joy Grid', text: getShareText(), url: getShareUrl() }).catch(()=>{});
  } else {
    copyShareText();
  }
}
function copyShareText() {
  navigator.clipboard.writeText(getShareText()).then(() => {
    const toast = document.getElementById('shareToast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  });
}

// Init
document.getElementById('best').textContent = best;
newGame();
</script>
