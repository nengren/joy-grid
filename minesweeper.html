*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#faf8f5;--text:#2d2a26;--text-soft:#6b6560;

  --cell-hidden:#d5cfe6;--cell-hidden-hover:#c9c0de;

  --card-shadow:0 4px 20px rgba(0,0,0,0.08);

}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background-image:linear-gradient(rgba(0,0,0,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,0.02) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}

nav{position:sticky;top:0;z-index:100;background:rgba(250,248,245,0.9);backdrop-filter:blur(12px);border-bottom:1px solid rgba(0,0,0,0.06);padding:0 24px}

.logo-grid span:nth-child(1){background:#ff6b35}
.logo-grid span:nth-child(2){background:#4ecdc4}
.logo-grid span:nth-child(3){background:#7c5cbf}

.nav-links{display:flex;gap:24px;align-items:center}
.nav-links a{text-decoration:none;color:var(--text-soft);font-weight:600;font-size:0.95rem;transition:color 0.2s}
.nav-links a:hover,.nav-links a.active{color:var(--accent)}

.game-container{max-width:600px;margin:0 auto;padding:24px 16px 48px;position:relative;z-index:1}
.game-header{text-align:center;margin-bottom:20px}
.game-header h1{font-family:'Fredoka',sans-serif;font-size:1.8rem;font-weight:700;margin-bottom:4px}
.game-header p{color:var(--text-soft);font-size:0.9rem}

.controls{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.difficulty-btns{display:flex;gap:4px}
.diff-btn{
  padding:6px 14px;border:2px solid #ddd;border-radius:20px;

.diff-btn.active{border-color:var(--accent);background:var(--accent);color:#fff}
.diff-btn:hover:not(.active){border-color:var(--accent);color:var(--accent)}

.stats{display:flex;gap:16px;align-items:center;font-size:0.9rem;font-weight:600}
.stats .timer{color:var(--accent-dark)}
.stats .mines-left{color:#e74c3c}

.board-wrapper{
  background:#fff;border-radius:var(--radius);box-shadow:var(--card-shadow);
  padding:12px;margin-bottom:16px;overflow-x:auto;
}
.board{
  display:grid;gap:2px;
  margin:0 auto;
  user-select:none;-webkit-user-select:none;
}
.cell{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  font-family:'Fredoka',sans-serif;font-weight:700;
  font-size:clamp(0.7rem,2.5vw,1rem);

  -webkit-tap-highlight-color:transparent;
  min-width:0;

.cell.hidden{background:var(--cell-hidden)}
.cell.hidden:hover{background:var(--cell-hidden-hover);transform:scale(1.05)}
.cell.revealed{background:var(--cell-revealed);cursor:default}
.cell.mine-hit{background:var(--cell-mine)}
.cell.flagged{background:#e8dff5}

.cell[data-num="1"]{color:#2980b9}
.cell[data-num="2"]{color:#27ae60}
.cell[data-num="3"]{color:#c0392b}
.cell[data-num="4"]{color:#8e44ad}
.cell[data-num="5"]{color:#d35400}
.cell[data-num="6"]{color:#16a085}
.cell[data-num="7"]{color:#2c3e50}
.cell[data-num="8"]{color:#7f8c8d}

.face-btn:hover{transform:scale(1.2)}

/* Win/Lose overlay */
.overlay{
  display:none;position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.5);z-index:200;
  justify-content:center;align-items:center;

.overlay.show{display:flex}
.overlay-card{
  background:#fff;border-radius:var(--radius);padding:40px;

  animation:popIn 0.4s ease;position:relative;

.close-btn{position:absolute;top:12px;right:12px;width:32px;height:32px;border:none;border-radius:50%;background:rgba(0,0,0,0.08);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:background 0.15s;color:#6b6560;-webkit-tap-highlight-color:transparent}
.close-btn:hover{background:rgba(0,0,0,0.15)}
.overlay-card h2{font-family:'Fredoka',sans-serif;font-size:2rem;margin-bottom:8px}
.overlay-card p{color:var(--text-soft);margin-bottom:24px;line-height:1.5}
.overlay-card button{

  font-size:1.1rem;font-weight:600;cursor:pointer;transition:transform 0.2s;

.overlay-card button:hover{transform:scale(1.05)}

/* Share buttons */
.share-section{margin-top:20px;padding-top:20px;border-top:1px solid #eee}

.share-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

  width:44px;height:44px;border:none;border-radius:12px;

  font-size:1.2rem;color:#fff;font-weight:700;

}
.share-btn:hover{transform:scale(1.1)}
.share-btn:active{transform:scale(0.95)}
.share-btn.twitter{background:#000}
.share-btn.facebook{background:#1877F2;font-size:1.4rem}
.share-btn.whatsapp{background:#25D366}
.share-btn.native-share{background:var(--accent);font-size:1.3rem}
.share-btn.copy-link{background:#6b6560;font-size:1.2rem}
.share-toast{
  display:none;position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  background:#333;color:#fff;padding:10px 24px;border-radius:10px;
  font-size:0.9rem;font-weight:600;z-index:300;
  animation:fadeInUp 0.3s ease;
}
.share-toast.show{display:block}
@keyframes fadeInUp{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

@keyframes popIn{from{transform:scale(0.8);opacity:0}to{transform:scale(1);opacity:1}}

footer{text-align:center;padding:24px;color:var(--text-soft);font-size:0.85rem;border-top:1px solid rgba(0,0,0,0.06);position:relative;z-index:1}
footer a{color:var(--accent);text-decoration:none}

@media(max-width:640px){
  .nav-links{display:none}
  .game-container{padding:16px 10px 32px}
}
</style>

<script>
const CONFIGS = {
  easy:   {rows:9,  cols:9,  mines:10},
  medium: {rows:16, cols:16, mines:40},
  hard:   {rows:16, cols:30, mines:99},
};

let config = CONFIGS.easy;
let difficulty = 'easy';
let grid = [];     // 2D: {mine, revealed, flagged, count}
let gameOver = false;
let gameStarted = false;
let flagMode = false;
let timerInterval = null;
let seconds = 0;
let flagsPlaced = 0;
let cellsRevealed = 0;
let totalSafe = 0;
let lastResult = {};

function newGame() {
  config = CONFIGS[difficulty];
  gameOver = false;
  gameStarted = false;
  flagsPlaced = 0;
  cellsRevealed = 0;
  totalSafe = config.rows * config.cols - config.mines;
  seconds = 0;
  clearInterval(timerInterval);
  document.getElementById('timer').textContent = '00:00';
  document.getElementById('faceBtn').textContent = '😊';
  document.getElementById('winOverlay').classList.remove('show');
  document.getElementById('loseOverlay').classList.remove('show');

  // Init empty grid
  grid = [];
  for (let r = 0; r < config.rows; r++) {
    grid[r] = [];
    for (let c = 0; c < config.cols; c++) {
      grid[r][c] = {mine: false, revealed: false, flagged: false, count: 0};
    }
  }
  updateMinesLeft();
  renderBoard();
}

function placeMines(safeR, safeC) {
  // Place mines, avoiding the first click and its neighbors
  const safeZone = new Set();
  for (let dr = -1; dr <= 1; dr++)
    for (let dc = -1; dc <= 1; dc++)
      safeZone.add(`${safeR+dr}-${safeC+dc}`);

  let placed = 0;
  while (placed < config.mines) {
    const r = Math.floor(Math.random() * config.rows);
    const c = Math.floor(Math.random() * config.cols);
    if (!grid[r][c].mine && !safeZone.has(`${r}-${c}`)) {
      grid[r][c].mine = true;
      placed++;
    }
  }

  // Calculate neighbor counts
  for (let r = 0; r < config.rows; r++)
    for (let c = 0; c < config.cols; c++)
      if (!grid[r][c].mine)
        grid[r][c].count = countNeighborMines(r, c);
}

function countNeighborMines(r, c) {
  let count = 0;
  for (let dr = -1; dr <= 1; dr++)
    for (let dc = -1; dc <= 1; dc++) {
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < config.rows && nc >= 0 && nc < config.cols && grid[nr][nc].mine)
        count++;
    }
  return count;
}

function renderBoard() {
  const el = document.getElementById('board');
  const cellSize = Math.min(
    Math.floor((window.innerWidth - 60) / config.cols),
    Math.floor(400 / config.rows),
    36
  );
  el.style.gridTemplateColumns = `repeat(${config.cols}, ${cellSize}px)`;
  el.style.width = `${config.cols * (cellSize + 2)}px`;
  el.innerHTML = '';

  for (let r = 0; r < config.rows; r++) {
    for (let c = 0; c < config.cols; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.style.width = cellSize + 'px';
      cell.style.height = cellSize + 'px';
      cell.style.fontSize = Math.max(cellSize * 0.45, 10) + 'px';
      const g = grid[r][c];

      if (g.revealed) {
        cell.classList.add('revealed');
        if (g.mine) {
          cell.classList.add('mine-hit');
          cell.textContent = '💣';
        } else if (g.count > 0) {
          cell.textContent = g.count;
          cell.dataset.num = g.count;
        }
      } else {
        cell.classList.add('hidden');
        if (g.flagged) {
          cell.classList.add('flagged');
          cell.textContent = '🚩';
        }
      }

      cell.addEventListener('click', () => handleClick(r, c));
      cell.addEventListener('contextmenu', e => { e.preventDefault(); toggleFlag(r, c); });

      // Long press for flag on mobile
      let longPressTimer;
      cell.addEventListener('touchstart', e => {
        longPressTimer = setTimeout(() => {
          e.preventDefault();
          toggleFlag(r, c);
        }, 400);
      }, {passive: false});
      cell.addEventListener('touchend', () => clearTimeout(longPressTimer));
      cell.addEventListener('touchmove', () => clearTimeout(longPressTimer));

      el.appendChild(cell);
    }
  }
}

function handleClick(r, c) {
  if (gameOver) return;
  const g = grid[r][c];

  if (flagMode && !g.revealed) {
    toggleFlag(r, c);
    return;
  }
  if (g.flagged || g.revealed) return;

  // First click: place mines
  if (!gameStarted) {
    gameStarted = true;
    placeMines(r, c);
    startTimer();
  }

  if (g.mine) {
    // Hit a mine!
    g.revealed = true;
    gameOver = true;
    clearInterval(timerInterval);
    document.getElementById('faceBtn').textContent = '😵';
    // Reveal all mines
    for (let rr = 0; rr < config.rows; rr++)
      for (let cc = 0; cc < config.cols; cc++)
        if (grid[rr][cc].mine) grid[rr][cc].revealed = true;
    renderBoard();
    const mins = Math.floor(seconds/60);
    const secs = seconds%60;
    const d = difficulty.charAt(0).toUpperCase() + difficulty.slice(1);
    lastResult = {won: false, difficulty: d, time: `${mins}m ${secs}s`, revealed: cellsRevealed, total: totalSafe};
    document.getElementById('loseMsg').textContent = `${d} mode · Revealed ${cellsRevealed} of ${totalSafe} safe squares`;
    setTimeout(() => document.getElementById('loseOverlay').classList.add('show'), 500);
    return;
  }

  reveal(r, c);
  renderBoard();
  checkWin();
}

function reveal(r, c) {
  if (r < 0 || r >= config.rows || c < 0 || c >= config.cols) return;
  const g = grid[r][c];
  if (g.revealed || g.flagged || g.mine) return;

  g.revealed = true;
  cellsRevealed++;

  if (g.count === 0) {
    // Flood fill
    for (let dr = -1; dr <= 1; dr++)
      for (let dc = -1; dc <= 1; dc++)
        if (dr !== 0 || dc !== 0)
          reveal(r + dr, c + dc);
  }
}

function toggleFlag(r, c) {
  if (gameOver) return;
  const g = grid[r][c];
  if (g.revealed) return;
  g.flagged = !g.flagged;
  flagsPlaced += g.flagged ? 1 : -1;
  updateMinesLeft();
  renderBoard();
}

function toggleFlagMode() {
  flagMode = !flagMode;
  const btn = document.getElementById('flagBtn');
  btn.classList.toggle('active', flagMode);
}

function updateMinesLeft() {
  document.getElementById('minesLeft').textContent = `💣 ${config.mines - flagsPlaced}`;
}

function startTimer() {
  clearInterval(timerInterval);
  seconds = 0;
  timerInterval = setInterval(() => {
    seconds++;
    document.getElementById('timer').textContent =
      `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;
  }, 1000);
}

function checkWin() {
  if (cellsRevealed === totalSafe) {
    gameOver = true;
    clearInterval(timerInterval);
    document.getElementById('faceBtn').textContent = '😎';
    // Auto-flag remaining mines
    for (let r = 0; r < config.rows; r++)
      for (let c = 0; c < config.cols; c++)
        if (grid[r][c].mine) grid[r][c].flagged = true;
    flagsPlaced = config.mines;
    updateMinesLeft();
    renderBoard();
    const mins = Math.floor(seconds/60);
    const secs = seconds%60;
    const d = difficulty.charAt(0).toUpperCase() + difficulty.slice(1);
    lastResult = {won: true, difficulty: d, time: `${mins}m ${secs}s`};
    document.getElementById('winMsg').textContent = `${d} mode cleared in ${mins}m ${secs}s!`;
    // Save best
    const key = `mine_best_${difficulty}`;
    const prev = localStorage.getItem(key);
    if (!prev || seconds < parseInt(prev)) localStorage.setItem(key, seconds);
    setTimeout(() => document.getElementById('winOverlay').classList.add('show'), 400);
  }
}

// Difficulty buttons
document.querySelectorAll('.diff-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    difficulty = btn.dataset.diff;
    newGame();
  });
});

// Resize handler
window.addEventListener('resize', () => {
  if (!gameOver) renderBoard();
});

// ===== SHARE FUNCTIONS =====
function getShareText() {
  if (lastResult.won) {
    return `💣 I cleared ${lastResult.difficulty} Minesweeper in ${lastResult.time}! Think you're faster?\n\nhttps://joy-grid.com/minesweeper.html`;
  } else {
    return `💥 I hit a mine on ${lastResult.difficulty} Minesweeper after revealing ${lastResult.revealed}/${lastResult.total} squares. Can you do better?\n\nhttps://joy-grid.com/minesweeper.html`;
  }
}
function getShareUrl() { return 'https://joy-grid.com/minesweeper.html'; }

function shareTwitter() {
  window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(getShareText())}`, '_blank');
}
function shareFacebook() {
  window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(getShareUrl())}`, '_blank');
}
function shareWhatsApp() {
  window.open(`https://wa.me/?text=${encodeURIComponent(getShareText())}`, '_blank');
}
function nativeShare() {
  if (navigator.share) {
    navigator.share({ title: 'Joy Grid Minesweeper', text: getShareText(), url: getShareUrl() }).catch(()=>{});
  }
}
function copyShareText() {
  navigator.clipboard.writeText(getShareText()).then(() => {
    const toast = document.getElementById('shareToast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  });
}
// Hide native share on desktop
if (!navigator.share) {
  document.querySelectorAll('.native-share').forEach(b => b.style.display = 'none');
}

// Start
newGame();
</script>
