<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Play Memory Match Online Free - Joy Grid</title>
<meta name="description" content="Play Memory Match card game online for free. Flip cards to find matching pairs. Test your memory with different grid sizes.">
<meta name="keywords" content="memory match online, card matching game, memory game, flip card puzzle, free memory game">
<link rel="canonical" href="https://joy-grid.com/memory-match.html">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="google-site-verification" content="7DqxoOPpfo0PQeDNIBDzLEqJ08DLbEXdFALsN3DRTM8" />
<meta property="og:title" content="Play Memory Match Online Free - Joy Grid">
<meta property="og:description" content="Flip cards, find matching pairs! Test your memory.">
<meta property="og:url" content="https://joy-grid.com/memory-match.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Joy Grid">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#faf8f5;--text:#2d2a26;--text-soft:#6b6560;--accent:#7c5cbf;--accent-dark:#6347a0;--radius:16px}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
body::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background-image:linear-gradient(rgba(0,0,0,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,0.02) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}
nav{position:sticky;top:0;z-index:100;background:rgba(250,248,245,0.9);backdrop-filter:blur(12px);border-bottom:1px solid rgba(0,0,0,0.06);padding:0 24px}
.nav-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:56px}
.logo{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.4rem;color:var(--text);text-decoration:none;display:flex;align-items:center;gap:8px}
.logo-grid{display:grid;grid-template-columns:repeat(2,9px);gap:2px}
.logo-grid span{width:9px;height:9px;border-radius:2px}
.logo-grid span:nth-child(1){background:#ff6b35}.logo-grid span:nth-child(2){background:#4ecdc4}.logo-grid span:nth-child(3){background:#7c5cbf}.logo-grid span:nth-child(4){background:#ffd93d}
.nav-links{display:flex;gap:20px}.nav-links a{text-decoration:none;color:var(--text-soft);font-weight:600;font-size:0.9rem}.nav-links a.active{color:var(--accent)}
.game-container{max-width:500px;margin:0 auto;padding:24px 16px 48px;position:relative;z-index:1}
.game-header{text-align:center;margin-bottom:16px}
.game-header h1{font-family:'Fredoka',sans-serif;font-size:1.8rem;font-weight:700;margin-bottom:4px}
.game-header p{color:var(--text-soft);font-size:0.9rem}
.controls{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.diff-btns{display:flex;gap:4px}
.diff-btn{padding:6px 14px;border:2px solid #ddd;border-radius:20px;background:none;font-family:'Nunito',sans-serif;font-weight:600;font-size:0.82rem;cursor:pointer;color:var(--text-soft)}
.diff-btn.active{border-color:var(--accent);background:var(--accent);color:#fff}
.stats{font-size:0.9rem;font-weight:600;color:var(--accent-dark)}
.board{display:grid;gap:8px;margin-bottom:16px}
.card{
  aspect-ratio:1;border-radius:12px;cursor:pointer;position:relative;
  transform-style:preserve-3d;transition:transform 0.4s ease;
  -webkit-tap-highlight-color:transparent;
}
.card.flipped{transform:rotateY(180deg)}
.card-face{
  position:absolute;top:0;left:0;width:100%;height:100%;
  border-radius:12px;display:flex;align-items:center;justify-content:center;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
}
.card-back{
  background:linear-gradient(145deg,#7c5cbf,#9b7dd4);
  box-shadow:0 3px 10px rgba(124,92,191,0.2),inset 0 1px 0 rgba(255,255,255,0.2);
}
.card-back::after{content:'?';font-family:'Fredoka',sans-serif;font-size:1.5rem;color:rgba(255,255,255,0.5);font-weight:700}
.card-front{
  background:#fff;transform:rotateY(180deg);
  box-shadow:0 3px 10px rgba(0,0,0,0.08);
}
.card.matched .card-front{background:#e8f8e8}
.card.matched{pointer-events:none}
.actions{display:flex;gap:8px;justify-content:center}
.action-btn{padding:8px 20px;border:2px solid #e0e0e0;border-radius:12px;background:none;font-family:'Nunito',sans-serif;font-weight:600;font-size:0.85rem;cursor:pointer;color:var(--text-soft)}
.overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:200;justify-content:center;align-items:center}
.overlay.show{display:flex}
.overlay-card{background:#fff;border-radius:var(--radius);padding:36px;text-align:center;max-width:360px;margin:20px;width:90%;position:relative;animation:popIn 0.4s ease}
.overlay-card h2{font-family:'Fredoka',sans-serif;font-size:1.8rem;margin-bottom:8px}
.overlay-card p{color:var(--text-soft);margin-bottom:20px}
.play-btn{padding:12px 32px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-family:'Fredoka',sans-serif;font-size:1.05rem;font-weight:600;cursor:pointer}
.close-btn{position:absolute;top:12px;right:12px;width:32px;height:32px;border:none;border-radius:50%;background:rgba(0,0,0,0.08);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;color:var(--text-soft)}
.share-section{margin-top:20px;padding-top:20px;border-top:1px solid #eee}
.share-label{font-size:0.85rem;color:var(--text-soft);margin-bottom:10px;font-weight:600}
.share-btns{display:flex;gap:8px;justify-content:center}
.share-btn{width:44px;height:44px;border:none;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.2rem;color:#fff;font-weight:700;font-family:'Nunito',sans-serif}
.share-btn.twitter{background:#000}.share-btn.whatsapp{background:#25D366}.share-btn.copy-link{background:#6b6560;font-size:1.1rem}
.share-desktop{display:flex;gap:8px;justify-content:center}
.share-mobile{display:none;flex-direction:column;align-items:center;gap:8px}
.share-mobile .share-main-btn{padding:10px 28px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-family:'Nunito',sans-serif;font-size:0.95rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px}
.share-mobile .copy-row{display:flex;gap:8px}
@media(max-width:768px){.share-desktop{display:none}.share-mobile{display:flex}}
.share-toast{display:none;position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 24px;border-radius:10px;font-size:0.9rem;font-weight:600;z-index:300}
.share-toast.show{display:block}
@keyframes popIn{from{transform:scale(0.8);opacity:0}to{transform:scale(1);opacity:1}}
footer{text-align:center;padding:24px;color:var(--text-soft);font-size:0.85rem;border-top:1px solid rgba(0,0,0,0.06);position:relative;z-index:1}
footer a{color:var(--accent);text-decoration:none}
@media(max-width:640px){.nav-links{display:none}}
</style>
</head>
<body>
<nav><div class="nav-inner"><a href="/" class="logo"><div class="logo-grid"><span></span><span></span><span></span><span></span></div>Joy Grid</a><div class="nav-links"><a href="/sudoku.html">Sudoku</a><a href="/2048.html">2048</a><a href="/memory-match.html" class="active">Memory</a></div></div></nav>

<div class="game-container">
  <div class="game-header"><h1>Memory Match</h1><p>Flip cards to find matching pairs</p></div>
  <div class="controls">
    <div class="diff-btns">
      <button class="diff-btn active" data-pairs="6">Easy</button>
      <button class="diff-btn" data-pairs="8">Medium</button>
      <button class="diff-btn" data-pairs="10">Hard</button>
    </div>
    <div class="stats"><span id="moves">0 moves</span> · <span id="timer">00:00</span></div>
  </div>
  <div class="board" id="board"></div>
  <div class="actions"><button class="action-btn" onclick="newGame()">🔄 New Game</button></div>
</div>

<div class="overlay" id="winOverlay"><div class="overlay-card">
  <button class="close-btn" onclick="document.getElementById('winOverlay').classList.remove('show')">✕</button>
  <h2>🎉 All Matched!</h2><p id="winMsg"></p>
  <button class="play-btn" onclick="newGame();document.getElementById('winOverlay').classList.remove('show')">Play Again</button>
  <div class="share-section"><div class="share-label">Challenge your friends</div><div class="share-btns">
    <div class="share-mobile"><button class="share-main-btn" onclick="nativeShare()">📤 Share Result</button><div class="copy-row"><button class="share-btn copy-link" onclick="copyShareText()">📋</button></div></div>
    <div class="share-desktop"><button class="share-btn twitter" onclick="shareTwitter()">𝕏</button><button class="share-btn whatsapp" onclick="shareWhatsApp()">WA</button><button class="share-btn copy-link" onclick="copyShareText()">📋</button></div>
  </div></div>
</div></div>
<div class="share-toast" id="shareToast">Copied!</div>

<footer><p><a href="/">Joy Grid</a> · <a href="/about.html">About</a> · <a href="/privacy.html">Privacy Policy</a></p></footer>

<script>
const EMOJIS = ['🐶','🐱','🦊','🐻','🐼','🐨','🦁','🐯','🐸','🐵','🦄','🐙','🦋','🐢','🐬','🦉','🍎','🍕','🎸','🚀'];
let pairs = 6, cards = [], flipped = [], matched = 0, moves = 0, locked = false, seconds = 0, timerInterval;

function newGame() {
  matched = 0; moves = 0; seconds = 0; flipped = []; locked = false;
  document.getElementById('winOverlay').classList.remove('show');
  clearInterval(timerInterval);
  document.getElementById('timer').textContent = '00:00';
  document.getElementById('moves').textContent = '0 moves';
  const picked = [...EMOJIS].sort(() => Math.random() - 0.5).slice(0, pairs);
  cards = [...picked, ...picked].sort(() => Math.random() - 0.5);
  const cols = pairs <= 6 ? 4 : pairs <= 8 ? 4 : 5;
  const el = document.getElementById('board');
  el.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  el.innerHTML = '';
  cards.forEach((emoji, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<div class="card-face card-back"></div><div class="card-face card-front" style="font-size:${pairs>8?'1.6rem':'2rem'}">${emoji}</div>`;
    card.addEventListener('click', () => flipCard(card, i));
    el.appendChild(card);
  });
  timerInterval = setInterval(() => { seconds++; document.getElementById('timer').textContent = `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`; }, 1000);
}

function flipCard(card, idx) {
  if (locked || card.classList.contains('flipped') || card.classList.contains('matched')) return;
  card.classList.add('flipped');
  flipped.push({card, idx});
  if (flipped.length === 2) {
    moves++;
    document.getElementById('moves').textContent = `${moves} moves`;
    locked = true;
    const [a, b] = flipped;
    if (cards[a.idx] === cards[b.idx]) {
      a.card.classList.add('matched');
      b.card.classList.add('matched');
      matched++;
      flipped = []; locked = false;
      if (matched === pairs) {
        clearInterval(timerInterval);
        document.getElementById('winMsg').textContent = `${pairs} pairs matched in ${moves} moves · ${Math.floor(seconds/60)}m ${seconds%60}s`;
        setTimeout(() => document.getElementById('winOverlay').classList.add('show'), 600);
      }
    } else {
      setTimeout(() => { a.card.classList.remove('flipped'); b.card.classList.remove('flipped'); flipped = []; locked = false; }, 800);
    }
  }
}

document.querySelectorAll('.diff-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    pairs = parseInt(btn.dataset.pairs);
    newGame();
  });
});

function getShareText() { return `🃏 I matched ${pairs} pairs in ${moves} moves! Can you do it in fewer?\n\nhttps://joy-grid.com/memory-match.html`; }
function getShareUrl() { return 'https://joy-grid.com/memory-match.html'; }
function shareTwitter() { window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(getShareText()), '_blank'); }
function shareWhatsApp() { window.open('https://wa.me/?text=' + encodeURIComponent(getShareText()), '_blank'); }
function nativeShare() { if (navigator.share) { navigator.share({title:'Joy Grid Memory Match',text:getShareText(),url:getShareUrl()}).catch(function(){}); } else { copyShareText(); } }
function copyShareText() { navigator.clipboard.writeText(getShareText()).then(function() { var t=document.getElementById('shareToast'); t.classList.add('show'); setTimeout(function(){t.classList.remove('show');},2000); }); }

newGame();
</script>
</body>
</html>
